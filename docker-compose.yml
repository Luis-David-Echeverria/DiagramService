# DiagramService detras de Caddy (TLS en 443). Ver docs/DEPLOY-HETZNER.md.
# Escrito el 1-nov-2026 SIN EJECUTAR: probar en Hetzner.
#
# Las variables salen de ./.env (junto a este fichero; plantilla: .env.example).
# Compose las interpola; cada contenedor recibe SOLO las suyas: Caddy nunca ve
# la clave.
name: diagramservice

services:
  diagramservice:
    build:
      context: .
      target: runtime
    image: diagramservice:${DIAGRAMSERVICE_TAG:?falta DIAGRAMSERVICE_TAG en .env}
    restart: unless-stopped
    environment:
      DIAGRAMSERVICE_API_KEYS: ${DIAGRAMSERVICE_API_KEYS:?falta DIAGRAMSERVICE_API_KEYS en .env}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-}
    # Puerto INTERNO 8080: solo en la red de compose, sin publicar en el host.
    expose:
      - "8080"
    networks: [interna]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "server/healthcheck.cjs"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    # Fijar por digest al instalar (caddy:2.x@sha256:...).
    image: caddy:2
    restart: unless-stopped
    depends_on:
      diagramservice:
        condition: service_healthy
    environment:
      DIAGRAMSERVICE_DOMAIN: ${DIAGRAMSERVICE_DOMAIN:?falta DIAGRAMSERVICE_DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en .env}
      DIAGRAMSERVICE_ALLOWED_IPS: ${DIAGRAMSERVICE_ALLOWED_IPS:?falta DIAGRAMSERVICE_ALLOWED_IPS en .env}
    # Solo el 443 se publica (TCP; HTTP/3 desactivado en el Caddyfile).
    ports:
      - "443:443/tcp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [interna, salida]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Sin salida a internet: el servicio no necesita llamar a nadie.
  interna:
    internal: true
  # Caddy necesita salida para Let's Encrypt.
  salida: {}

volumes:
  caddy_data: {}
  caddy_config: {}
